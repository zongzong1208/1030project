<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f4">
<title>日常｜個人行程與任務</title>
<style>
:root{--ink:#232820;--muted:#878b80;--line:#e9e9e2;--paper:#fff;--bg:#f7f7f4;--green:#385d46;--mint:#e6eee7;--amber:#c27b43;--red:#bf6659;--shadow:0 10px 30px #2633210a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1230px;margin:auto;padding:32px 42px 70px}.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.04em}.brand-mark{width:30px;height:30px;background:var(--green);border-radius:9px;display:grid;place-items:center;color:white;font-size:16px}.top-right{display:flex;align-items:center;gap:14px}.today-label{color:var(--muted);font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8e4d8;color:#71695a;display:grid;place-items:center;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 298px;gap:26px;align-items:start}.main{min-width:0}.greeting{margin:5px 0 3px;font-size:28px;letter-spacing:-.035em;font-weight:650}.subtitle{color:var(--muted);margin-bottom:27px}.date-strip{display:flex;align-items:center;gap:10px;margin-bottom:24px}.date-nav{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:white}.date-title{font-size:18px;font-weight:650;margin:0 5px}.today-btn{border:0;background:var(--mint);color:var(--green);padding:8px 12px;border-radius:9px;font-size:12px;font-weight:650}.quick-add{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:24px;box-shadow:var(--shadow)}.add-tabs{display:flex;gap:5px;padding-bottom:13px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px}.tab.active{background:var(--mint);color:var(--green)}.form-row{display:flex;gap:9px;align-items:center;padding-top:13px}.form-row input[type=text]{flex:1;min-width:80px;border:0;outline:0;padding:10px 2px;color:var(--ink);font-size:14px}.form-row input::placeholder{color:#a4a69f}.field{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;color:#666b61;font-size:12px}.primary{border:0;background:var(--green);color:white;border-radius:9px;padding:10px 15px;font-size:12px;font-weight:650;white-space:nowrap}.primary:hover{background:#294936}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 1px 11px}.section-head h2{font-size:16px;margin:0;font-weight:700}.count{font-size:11px;color:var(--muted);font-weight:500;margin-left:7px}.section-note{font-size:11px;color:var(--muted)}.list{background:white;border:1px solid var(--line);border-radius:14px;padding:2px 16px;box-shadow:var(--shadow)}.item{min-height:60px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f0eb}.item:last-child{border-bottom:0}.check{width:19px;height:19px;border:1.5px solid #cdd1c7;background:white;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;padding:0}.check.done{background:var(--green);border-color:var(--green);color:white;font-size:11px}.item-copy{min-width:0;flex:1}.item-title{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item.done-row .item-title{text-decoration:line-through;color:#a5a89f}.item-meta{margin-top:4px;font-size:11px;color:var(--muted)}.time-pill{font-size:11px;color:#687363;background:#f3f5f0;padding:6px 8px;border-radius:7px;white-space:nowrap}.due-pill{font-size:11px;color:var(--amber);background:#fbf2e9;padding:6px 8px;border-radius:7px;white-space:nowrap}.overdue{color:var(--red);background:#fbefed}.empty{padding:22px;text-align:center;color:#a1a398;font-size:12px}.side{display:flex;flex-direction:column;gap:16px;padding-top:8px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.card-head h2{font-size:14px;margin:0;font-weight:700}.month-nav{display:flex;align-items:center;gap:6px}.month-name{font-weight:650;font-size:13px;min-width:94px;text-align:center}.mini-nav{width:25px;height:25px;border:0;background:transparent;color:#82877d;border-radius:6px}.mini-nav:hover{background:#f3f4ef}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.weekday{font-size:10px;color:#a0a398;padding:4px 0 7px}.day{position:relative;height:30px;border:0;background:transparent;border-radius:50%;font-size:11px;color:#62675e;padding:0}.day:hover{background:#f1f3ed}.day.other{color:#c6c8c0}.day.selected{background:var(--green);color:white;font-weight:700}.day.today:not(.selected){color:var(--green);font-weight:750}.day.has-items:after{content:"";position:absolute;width:3px;height:3px;background:#d28b55;border-radius:50%;left:50%;bottom:2px;transform:translateX(-50%)}.day.selected.has-items:after{background:white}.legend{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--muted);font-size:10px}.dot{width:5px;height:5px;background:#d28b55;border-radius:50%}.due-card{background:#f4f6f1;border:1px solid #e9eee6}.due-card .card-head{margin-bottom:12px}.due-icon{width:27px;height:27px;border-radius:8px;background:#e5ece3;color:var(--green);display:grid;place-items:center;margin-right:8px;font-size:14px}.due-title-wrap{display:flex;align-items:center}.due-summary{color:var(--muted);font-size:11px;margin:0 0 10px}.due-list{display:flex;flex-direction:column;gap:8px}.due-entry{background:white;border-radius:9px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px}.due-entry-title{font-size:12px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.due-entry-date{color:var(--amber);font-size:10px;white-space:nowrap}.due-empty{padding:12px 0 5px;color:#888e82;font-size:12px}.tip{font-size:11px;line-height:1.6;color:#8b9085;margin:0}.item-delete{border:0;background:transparent;color:#b2b5ac;font-size:16px;opacity:0;padding:6px}.item:hover .item-delete{opacity:1}.item-delete:hover{color:var(--red)}.mobile-date{display:none}
@media(max-width:850px){.app{padding:22px 24px 50px}.layout{grid-template-columns:minmax(0,1fr) 270px;gap:16px}.greeting{font-size:25px}.form-row{flex-wrap:wrap}.form-row input[type=text]{flex-basis:100%}.primary{margin-left:auto}}
@media(max-width:650px){.app{padding:16px 16px 40px}.topbar{margin-bottom:22px;height:42px}.brand{font-size:16px}.top-right{gap:9px}.today-label{font-size:11px}.layout{display:flex;flex-direction:column;gap:20px}.main{width:100%}.side{width:100%;padding-top:0;display:grid;grid-template-columns:1fr 1fr;align-items:start}.side .card{padding:15px}.calendar-card{grid-column:1/-1}.greeting{font-size:24px;margin-top:1px}.subtitle{font-size:12px;margin-bottom:20px}.date-strip{margin-bottom:18px}.date-title{font-size:16px}.quick-add{padding:13px;margin-bottom:20px}.form-row{gap:8px}.form-row input[type=text]{flex-basis:100%;padding:6px 2px}.field{flex:1}.primary{margin-left:0}.section-head{margin-top:21px}.list{padding:2px 12px}.item{min-height:58px}.item-delete{opacity:1}.card-head{margin-bottom:12px}.side .due-card{grid-column:1/-1}.due-card .due-list{display:grid;grid-template-columns:1fr 1fr}.due-card .due-entry{padding:9px}.side .tip-card{grid-column:1/-1}.day{height:32px}}
@media(max-width:380px){.side{grid-template-columns:1fr}.calendar-card,.side .due-card,.side .tip-card{grid-column:auto}.due-card .due-list{grid-template-columns:1fr}.top-right .today-label{display:none}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">日</span><span>日常</span></div><div class="top-right"><span class="today-label" id="headerDate"></span><span class="avatar">我</span></div></header>
<div class="layout"><main class="main"><h1 class="greeting" id="greeting">早安，今天也加油</h1><div class="subtitle">把重要的事，一件一件完成。</div>
<div class="date-strip"><button class="date-nav" id="prevDay" aria-label="前一天">‹</button><h2 class="date-title" id="dateTitle"></h2><button class="date-nav" id="nextDay" aria-label="後一天">›</button><button class="today-btn" id="goToday">回到今天</button></div>
<section class="quick-add"><div class="add-tabs"><button class="tab active" data-type="task">＋ 任務</button><button class="tab" data-type="event">◷ 行程</button></div><form id="addForm" class="form-row"><input id="itemName" type="text" placeholder="新增一項任務…" maxlength="100" required aria-label="標題"><input class="field" id="itemDate" type="date" aria-label="日期"><input class="field" id="itemTime" type="time" aria-label="時間" style="display:none"><button class="primary" type="submit">新增</button></form></section>
<div class="section-head"><h2>今日行程 <span class="count" id="eventCount"></span></h2><span class="section-note">按時間排序</span></div><div class="list" id="eventList"></div>
<div class="section-head"><h2>今日任務 <span class="count" id="taskCount"></span></h2><span class="section-note">完成後勾選</span></div><div class="list" id="taskList"></div>
</main><aside class="side"><section class="card calendar-card"><div class="card-head"><h2>小月曆</h2><div class="month-nav"><button class="mini-nav" id="prevMonth" aria-label="上個月">‹</button><span class="month-name" id="monthName"></span><button class="mini-nav" id="nextMonth" aria-label="下個月">›</button></div></div><div class="calendar" id="calendar"></div><div class="legend"><span class="dot"></span>有安排的日期</div></section>
<section class="card due-card"><div class="card-head"><div class="due-title-wrap"><span class="due-icon">◷</span><h2>即將到期</h2></div><span class="count" id="dueCount"></span></div><p class="due-summary">接下來 3 天內的未完成任務</p><div class="due-list" id="dueList"></div></section>
<section class="card tip-card"><p class="tip">小提醒<br>任務只需設定日期，行程可加入開始時間。所有資料會保存在這台裝置的瀏覽器中。</p></section></aside></div></div>
<script>
(()=>{const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0'), dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, today=new Date();today.setHours(0,0,0,0);let selected=new Date(today),calendarMonth=new Date(today.getFullYear(),today.getMonth(),1),type='task';const storeKey='daily-planner-v1';let items=[];try{items=JSON.parse(localStorage.getItem(storeKey)||'[]')}catch{}const save=()=>localStorage.setItem(storeKey,JSON.stringify(items));const fmtDate=(d,opts={month:'long',day:'numeric',weekday:'short'})=>new Intl.DateTimeFormat('zh-TW',opts).format(d);const relative=d=>{const n=Math.round((d-today)/86400000);return n===0?'今天':n===1?'明天':n<0?`${Math.abs(n)} 天前`:`${n} 天後`};
function render(){const key=dateKey(selected),isToday=key===dateKey(today);$('#dateTitle').textContent=isToday?'今天 · '+fmtDate(selected):fmtDate(selected,{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('#headerDate').textContent=fmtDate(today,{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('#greeting').textContent=isToday?'早安，今天也加油':'安排好每一天';$('#itemDate').value=key;const events=items.filter(x=>x.type==='event'&&x.date===key).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const tasks=items.filter(x=>x.type==='task'&&x.date===key);$('#eventCount').textContent=events.length?`${events.length} 項`:'';$('#taskCount').textContent=tasks.length?`${tasks.filter(x=>!x.done).length} 項未完成`:'';drawList('#eventList',events,'event');drawList('#taskList',tasks,'task');drawCalendar();drawDue()}
function drawList(sel,list,t){const el=$(sel);if(!list.length){el.innerHTML=`<div class="empty">${t==='event'?'今天還沒有行程，留點空白也很好。':'今天沒有待辦，享受清爽的一天。'}</div>`;return}el.innerHTML=list.map(x=>`<div class="item ${x.done?'done-row':''}">${t==='task'?`<button class="check ${x.done?'done':''}" data-done="${x.id}" aria-label="${x.done?'標記未完成':'完成任務'}">${x.done?'✓':''}</button>`:`<span class="time-pill">${x.time||'未設定時間'}</span>`}<div class="item-copy"><div class="item-title">${esc(x.title)}</div>${t==='task'&&x.done?'<div class="item-meta">已完成</div>':''}</div>${t==='task'&&!x.done?`<span class="${x.date<dateKey(today)?'due-pill overdue':'due-pill'}">${x.date<dateKey(today)?'已逾期':isDueSoon(x.date)?'即將到期':''}</span>`:''}<button class="item-delete" data-del="${x.id}" aria-label="刪除">×</button></div>`).join('')||'<div class="empty">沒有未完成的任務。</div>'}
function isDueSoon(k){const n=(parseDate(k)-today)/86400000;return n>=0&&n<=3}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();$('#monthName').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long'}).format(calendarMonth);const names=['日','一','二','三','四','五','六'];let html=names.map(n=>`<span class="weekday">${n}</span>`).join('');const start=new Date(y,m,1),offset=start.getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();for(let i=0;i<42;i++){let d,other=false;if(i<offset){d=new Date(y,m-1,prevDays-offset+i+1);other=true}else if(i>=offset+days){d=new Date(y,m+1,i-offset-days+1);other=true}else d=new Date(y,m,i-offset+1);const k=dateKey(d),cls=['day',other?'other':'',k===dateKey(selected)?'selected':'',k===dateKey(today)?'today':'',items.some(x=>x.date===k)?'has-items':''].filter(Boolean).join(' ');html+=`<button class="${cls}" data-date="${k}" aria-label="${k}">${d.getDate()}</button>`}$('#calendar').innerHTML=html}
function drawDue(){const upcoming=items.filter(x=>x.type==='task'&&!x.done&&x.date>=dateKey(today)&&x.date<=dateKey(new Date(today.getFullYear(),today.getMonth(),today.getDate()+3))).sort((a,b)=>a.date.localeCompare(b.date));$('#dueCount').textContent=upcoming.length?`${upcoming.length} 項`:'';$('#dueList').innerHTML=upcoming.length?upcoming.slice(0,5).map(x=>`<div class="due-entry"><span class="due-entry-title">${esc(x.title)}</span><span class="due-entry-date">${relative(parseDate(x.date))}</span></div>`).join(''):'<div class="due-empty">近期沒有到期任務 ✨</div>'}
$('.add-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;$('.tab.active').classList.remove('active');b.classList.add('active');$('#itemName').placeholder=type==='task'?'新增一項任務…':'新增一個行程…';$('#itemTime').style.display=type==='event'?'':'none';$('#itemDate').value=dateKey(selected)});$('#addForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#itemName').value.trim();if(!title)return;items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,type,date:$('#itemDate').value||dateKey(selected),time:type==='event'?$('#itemTime').value:'',done:false});save();$('#itemName').value='';$('#itemTime').value='';render();$('#itemName').focus()});document.addEventListener('click',e=>{const done=e.target.closest('[data-done]'),del=e.target.closest('[data-del]'),day=e.target.closest('[data-date]');if(done){const x=items.find(i=>i.id===done.dataset.done);if(x)x.done=!x.done;save();render()}if(del){items=items.filter(i=>i.id!==del.dataset.del);save();render()}if(day){selected=parseDate(day.dataset.date);calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1);render()}});$('#prevDay').onclick=()=>{selected.setDate(selected.getDate()-1);calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1);render()};$('#nextDay').onclick=()=>{selected.setDate(selected.getDate()+1);calendarMonth=new Date(selected.getFullYear(),selected.getMonth(),1);render()};$('#goToday').onclick=()=>{selected=new Date(today);calendarMonth=new Date(today.getFullYear(),today.getMonth(),1);render()};$('#prevMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);drawCalendar()};$('#nextMonth').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);drawCalendar()};render()})();
</script></body></html>
